name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: self check (README と CONTRIBUTING が自らの検査を通ること)
        run: node src/cli.mjs check README.md CONTRIBUTING.md
      - name: 比較表がコーパスと同期していること
        run: node tools/render-comparison.mjs > /tmp/before-after.md && diff /tmp/before-after.md docs/before-after.md
