# 書式の型 — 語彙ではなく見た目に表れる AI 文章の癖。

- id: formatting/emoji-heading
  severity: error
  pattern: '^#{1,6} ?[^\n]*\p{Extended_Pictographic}'
  why: 絵文字付き見出しは装飾が内容より先に立ち、文書の信用を下げる。
  ask: 見出しは内容を表す語だけにする。
  examples:
    bad:
      - '## 🚀 はじめに'
    good:
      - '## はじめに'
  deny_examples:
    - '本文中の絵文字の扱いはチャンネルの慣習に従う。'

- id: formatting/double-exclamation
  severity: error
  pattern: '(?<!「[^「」]*)[！!]{2,}'
  why: 感嘆符の重ねがけは誇張の書式版。かぎかっこ内 (作品名・引用) は対象外。
  ask: 感嘆符を減らし、伝えたい事実を本文に書く。
  examples:
    bad:
      - '新バージョンがリリースされました！！'
    good:
      - '新バージョンをリリースしました。変更点は 3 つあります。'
  deny_examples:
    - '「重要！」と書かれた付箋が貼ってあった。'
    - '「絶対合格!!」という参考書を買った。'

- id: formatting/bold-spam
  severity: warn
  manual: true
  why: 段落中に太字を散りばめると、読み手が拾うべき強弱を書き手が決めつけた文になり、機械生成の印象を与える。
  ask: 段落内の太字は原則 0 にする。強調したい内容は文の構成で先頭に置く。
  examples:
    bad:
      - '**重要**なのは**スピード**と**品質**の**両立**です。'
    good:
      - '優先するのは処理速度です。品質は自動テストの通過を条件とします。'

- id: formatting/kagikakko-emphasis
  severity: info
  manual: true
  why: かぎかっこの強調転用は、引用・発話との区別を失わせる。
  ask: 強調をやめて語を具体化するか、本当に引用なら出典を書く。
  examples:
    bad:
      - 'それが「本当の」課題です。'
    good:
      - '未解決の課題は、権限設計の担当が決まっていないことです。'

- id: formatting/bold-list-prefix
  severity: warn
  pattern: '^ *[-*・] *\*\*[^*\n]+\*\*'
  why: 箇条書きの太字プリフィックス (「**重要**:」等) は機械的な強調の型。強弱は文の構成で表す。
  ask: 太字を外し、重要な項目は先頭に置くか理由を書く。
  refs:
    - 'textlint-rule-preset-ai-writing (MIT) と同観点の独自実装'
  examples:
    bad:
      - '- **重要**: 設定ファイルを確認してください。'
    good:
      - '- 設定ファイルを確認します。誤設定は起動時に検出されません。'
  deny_examples:
    - '**注意** 段落先頭の太字は bold-spam の対象。'

- id: formatting/emoji-list
  severity: warn
  pattern: '^ *(?:[-*・]|\d+\.) *[\p{Extended_Pictographic}✅❌]'
  why: 絵文字を先頭に付けた箇条書きは装飾が内容より先に立つ。
  ask: 絵文字を外す。可否は「使える・使えない」等の語で書く。
  refs:
    - 'textlint-rule-preset-ai-writing (MIT) と同観点の独自実装'
  examples:
    bad:
      - '- ✅ 高速な処理'
    good:
      - '- 処理は平均 0.4 秒で完了します。'
  deny_examples:
    - '- 絵文字の扱いはチャンネルの慣習に従う。'

- id: formatting/section-symbol
  severity: error
  pattern: '(?<!法)§ ?\d|セクション ?\d'
  why: 「§3」「セクション2」は英語文書の参照記法の直訳で、日本語の本文では見出し名の方が読み手に残る。
  ask: 参照先の見出し名で書く (「検出の設計方針」の節を参照、のように)。
  examples:
    bad:
      - '詳細は§3を参照してください。'
    good:
      - '詳細は「検出の設計方針」の節を参照してください。'
  deny_examples:
    - '米国特許法§102に基づく主張である。'

- id: formatting/chapter-number-ref
  severity: warn
  pattern: '(?:(?<!の)第\d+|(?<!の)(?<!第)\d+)章(?:で(?:述べ|触れ|解説|説明|示し)|を参照|の(?:通り|とおり))|(?:前|次|本)章で|(?:前|次|本)節で'
  why: 章番号によるページ内参照は、構成を変えた瞬間に壊れ、読み手も位置を思い出せない。
  ask: 参照先の見出し名で書く。番号は振り直されるが、見出し名は内容と一緒に動く。
  examples:
    bad:
      - '10章で述べたように、検出は辞書が担う。'
      - '前章で触れた設定をここで使う。'
    good:
      - '「誤検出と戦う設計」の節で述べたように、検出は辞書が担います。'
  deny_examples:
    - '教科書の第4章を参照するとよい。'
    - '第3章はデータ構造を扱う。'
