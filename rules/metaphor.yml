# 比喩の型 — 抽象概念を物にたとえて、指す対象を曖昧にする表現。
# 「比喩を消す」のではなく、ask の問いに答える情報で置き換える。

- id: metaphor/compass
  severity: error
  pattern: '(?<!船の)(?<!航海の)羅針盤'
  why: 「指針」の比喩として頻出するが、誰がどの判断に使うのかが書かれない。
  ask: 誰が、どの判断を、何を基準に決めるのかを書く。
  examples:
    bad:
      - 'この文書はチームの羅針盤です。'
    good:
      - '実装方針で迷ったときは、この文書の判断基準の節に従います。'
  deny_examples:
    - '博物館で古い船の羅針盤を見た。'

- id: metaphor/heart
  severity: error
  pattern: '(の|たる)心臓部'
  why: 中心的だと言うだけで、なぜ中心なのかが書かれない。
  ask: それが止まったとき、何が動かなくなるのかを書く。
  examples:
    bad:
      - 'この決済モジュールはシステムの心臓部です。'
    good:
      - 'この決済モジュールが止まると、全サービスの売上処理が止まります。'
  deny_examples:
    - '心臓外科の手術は予定どおり終了した。'
    - '心臓の鼓動が速くなった。'

- id: metaphor/backbone
  severity: error
  pattern: '(の|を支える)屋台骨'
  why: 重要性の主張だけで、依存関係の実体が書かれない。
  ask: それが何を支えているのか、依存の向きを具体的に書く。
  examples:
    bad:
      - '認証基盤は全サービスの屋台骨です。'
    good:
      - '認証基盤が止まると、全サービスでログインできなくなります。'
  deny_examples:
    - '祭りの屋台の骨組みを補強した。'

- id: metaphor/dna
  severity: error
  pattern: '(企業|会社|組織|チーム|創業|ブランド|文化|我々|私たち)のDNA'
  why: 組織の性質を生得的なものに見せ、根拠の提示を省く表現。
  ask: その性質が表れた具体的な行動や制度を書く。
  examples:
    bad:
      - '挑戦を恐れないのが我々のDNAです。'
    good:
      - '失敗した実験プロジェクトにも翌年の予算を配分しています。'
  deny_examples:
    - 'DNA鑑定の結果が届いた。'

- id: metaphor/cornerstone
  severity: warn
  pattern: 'の礎(と|に|を)'
  why: 「基礎として重要」の言い換えで、何にどう効くのかが書かれない。
  ask: それがないと何ができないのかを書く。
  examples:
    bad:
      - '信頼関係の礎を築くことが第一です。'
    good:
      - '週次の進捗共有を 3 か月続け、遅延の申告が早まりました。'
  deny_examples:
    - '発掘調査で礎石の配置が判明した。'

- id: metaphor/two-wheels
  severity: error
  pattern: '車の両輪'
  why: 「両方大事」以上の情報がない。
  ask: それぞれの役割の違いと、連携の実体を書く。
  examples:
    bad:
      - '開発と営業は車の両輪です。'
    good:
      - '開発が仕様を決め、営業が価格を決めます。相互レビューは月次で行います。'
  deny_examples:
    - '両輪駆動の模型を組み立てた。'

- id: metaphor/catalyst
  severity: error
  surface:
    - '起爆剤'
    - 'カンフル剤'
  why: 変化のきっかけになると言うだけで、因果の中身が書かれない。
  ask: 何がどう変わる見込みか、根拠と併せて書く。
  examples:
    bad:
      - '新製品が市場拡大の起爆剤となります。'
    good:
      - '新製品の投入後、問い合わせ件数が前月比で 4 割増えました。'
  deny_examples:
    - '雷管と導火線の保管規程を見直した。'

- id: metaphor/bridge
  severity: warn
  pattern: 'の架け橋'
  why: 「つなぐ」の抽象化で、何をどう仲介するのかが書かれない。
  ask: 誰と誰の、どんなやり取りを仲介するのかを書く。
  examples:
    bad:
      - '本事業は地域と企業の架け橋となります。'
    good:
      - '本事業は地域の生産者と企業の調達部門の間で、受発注の窓口を担います。'
  deny_examples:
    - '川に橋を架ける工事が始まった。'

- id: metaphor/signpost
  severity: warn
  pattern: '(人生|経営|判断|キャリア|学び|成長)の道(しるべ|標)'
  why: 「参考になる」の比喩で、何を判断するときに参照するのかが書かれない。
  ask: どの場面で、何を決めるために参照するのかを書く。
  examples:
    bad:
      - 'この本はキャリアの道標になります。'
    good:
      - '転職か昇進かを迷ったとき、この本にある判断基準で比較できます。'
  deny_examples:
    - '登山道の道標を頼りに下山した。'

- id: metaphor/blood-oil
  severity: error
  pattern: '(組織|経済|会社|事業)の血液|新しい石油'
  why: 重要性を資源にたとえるだけで、利用の実体が書かれない。
  ask: 誰がどう使うと何が得られるのかを書く。
  examples:
    bad:
      - 'データは新しい石油と呼ばれています。'
    good:
      - '購買ログを需要予測に使い、欠品率を 2 % 下げました。'
  deny_examples:
    - '血液検査の数値は基準範囲内だった。'

- id: metaphor/hole
  severity: warn
  pattern: '(議論|理論|論理|計画|戦略|制度|防御|理屈)(に|の)は?(大きな)?穴'
  why: 欠陥があると言うだけで、どこがどう欠けているのかが書かれない。
  ask: 欠けている条件・ケース・前提を特定して書く。
  examples:
    bad:
      - 'この計画には大きな穴がある。'
    good:
      - 'この計画は、担当者が不在のときの引き継ぎ手順を定めていません。'
  deny_examples:
    - '壁に穴が開いたので業者に修理を頼んだ。'
    - '穴場の温泉宿を予約した。'

- id: metaphor/gamechanger
  severity: error
  surface:
    - 'ゲームチェンジャー'
  why: 「大きな変化」の主張だけで、何のルールがどう変わるのかが書かれない。
  ask: 従来の前提のうち、何が成り立たなくなるのかを書く。
  examples:
    bad:
      - '生成AIは業界のゲームチェンジャーです。'
    good:
      - '見積もり作成が 2 時間から 10 分になり、営業が当日中に再提案できます。'

- id: metaphor/treasure
  severity: warn
  pattern: 'の宝庫|宝の山'
  why: 価値があると言うだけで、何をどう取り出せるのかが書かれない。
  ask: そこから具体的に何が得られたか、1 つ例を書く。
  examples:
    bad:
      - 'このログは知見の宝庫です。'
    good:
      - 'このログから障害の前兆パターンを 3 種類抽出できました。'
  deny_examples:
    - '正倉院の宝物庫を見学した。'

- id: metaphor/key
  severity: warn
  pattern: '成功の(鍵|カギ)|(鍵|カギ)を握る'
  why: 重要性の主張だけで、因果の中身が書かれない。
  ask: それがどう結果に効くのか、経路を書く。
  examples:
    bad:
      - 'データ活用が成功の鍵を握っています。'
    good:
      - '在庫データを発注に反映できれば、欠品による機会損失を減らせます。'
  deny_examples:
    - '金庫の鍵を交換した。'

- id: metaphor/kaku
  severity: error
  pattern: '(の|が)核(です|でした|である|とな[りるっ]|に据え)'
  why: 英語 core の直訳。日本語の文書では「中心」「よりどころ」の意味で「核」を使う言い回しは定着していない。
  ask: 核と呼んでいる対象の役割を具体的に書く (すべての判定がそこを通る、等)。
  examples:
    bad:
      - 'この辞書が設計の核です。'
    good:
      - 'この辞書がすべての判定の唯一の情報源です。'
  deny_examples:
    - '原子核の構造を調べた。'
    - '核家族の世帯が増えた。'

- id: metaphor/green-success
  severity: warn
  pattern: '(テスト|CI|ビルド|パイプライン|チェック)(が|は|も)(すべて|全部)?緑'
  why: CI 画面の色をそのまま結果の意味に使う英語圏の口語。文書の読み手全員が共有する表現ではない。
  ask: 「成功した」「全件通過した」のように結果を書く。
  examples:
    bad:
      - 'テストがすべて緑になりました。'
    good:
      - 'テストは全 299 件が成功しました。'
  deny_examples:
    - '信号が緑になってから渡った。'
    - '公園の緑が濃くなってきた。'

- id: metaphor/north-star
  severity: warn
  pattern: '(組織|チーム|事業|経営|プロダクト|開発)の北極星'
  why: North Star の直訳。方針の比喩として使われるが、何を判断するときに参照するのかが書かれない。
  ask: どの判断で、何より優先する指標なのかを書く。
  examples:
    bad:
      - 'この指標がチームの北極星です。'
    good:
      - '判断が分かれたときは、この指標の改善を他のすべてに優先します。'
  deny_examples:
    - '夜空で北極星を探した。'

- id: metaphor/puzzle-piece
  severity: warn
  pattern: '最後のピース(です|とな|と言え)'
  why: 「残っていた課題」の比喩で、何が欠けていたのかが書かれない。
  ask: 欠けていた機能・工程を特定して書く。
  examples:
    bad:
      - '生成AIは業務自動化の最後のピースです。'
    good:
      - '未対応だった請求書の読み取りを、生成AIが担います。'
  deny_examples:
    - 'ジグソーパズルの最後のピースをはめた。'

- id: metaphor/weapon
  severity: warn
  pattern: '(最強|最大|強力)の武器|が武器に(なり|なる)'
  why: 「強み」の比喩で、何に対してどう有利なのかが書かれない。
  ask: どの場面で、何と比べて有利になるのかを書く。
  examples:
    bad:
      - '英語力はエンジニア最強の武器です。'
    good:
      - '外資系の求人 6 割が英語要件を含み、選択肢が約 2 倍になります。'
  deny_examples:
    - '博物館で中世の武器を見た。'

- id: metaphor/chemistry
  severity: warn
  pattern: '(チーム|組織|メンバー)の化学反応'
  why: 「相互作用が良い」の比喩で、何が起きたのかが書かれない。
  ask: 誰と誰の間で、何が生まれたのかを書く。
  examples:
    bad:
      - '新メンバーの加入でチームの化学反応が生まれました。'
    good:
      - '設計とテストの担当が互いにレビューし、仕様の抜けを 3 件見つけました。'
  deny_examples:
    - '化学反応式の係数を合わせる問題を解いた。'

- id: metaphor/irodoru
  severity: warn
  pattern: '(日常|生活|毎日|暮らし)を彩る'
  why: 広告の常套句で、製品が何をするのかが書かれない。
  ask: 使う場面と、使う前後で何が変わるのかを書く。
  examples:
    bad:
      - '毎日を彩るアプリです。'
    good:
      - '毎朝の献立を、冷蔵庫の在庫から 3 分で提案します。'
  deny_examples:
    - '紅葉が庭園を彩る季節になった。'

- id: metaphor/kiri-hiraku
  severity: warn
  pattern: '(未来|時代|新時代|可能性)を切り(拓|開)|フロンティアを開拓'
  why: 前進の比喩で、次に何をするのかが書かれない。
  ask: 具体的に何を始めるのか、最初の 1 手を書く。
  examples:
    bad:
      - '両社の提携で新時代を切り拓きます。'
    good:
      - '両社は来期、共同で保守部品の在庫を一元化します。'
  deny_examples:
    - '山道を切り開いて進んだ。'

- id: metaphor/jidai-tourai
  severity: warn
  pattern: '時代が(到来|やって来)|の波が押し寄せ'
  why: 変化の大きさを演出する定型で、根拠となる事実が書かれない。
  ask: 普及率・導入数など、変化を示す観測値を書く。
  examples:
    bad:
      - 'AIの時代が到来しました。'
    good:
      - '国内企業の生成AI導入率は 4 割に達しました (2026 年調査)。'
  deny_examples:
    - '高波が押し寄せて堤防を越えた。'

- id: metaphor/junkatsuyu
  severity: warn
  pattern: '(組織|チーム|職場)の潤滑油'
  why: 「関係を円滑にする」の比喩で、実際の働きが書かれない。
  ask: 誰の間の、どんな摩擦をどう減らしているのかを書く。
  examples:
    bad:
      - '彼女は組織の潤滑油のような存在です。'
    good:
      - '部署間の依頼はすべて彼女が窓口になり、往復の確認が減りました。'
  deny_examples:
    - 'エンジンオイルなどの潤滑油を交換した。'

- id: metaphor/engine
  severity: warn
  pattern: '(成長|事業|経済|変革)のエンジン'
  why: 「推進力」の比喩で、因果の実体が書かれない。
  ask: 何がどの数字を動かしているのかを書く。
  examples:
    bad:
      - '新規事業が成長のエンジンとなっています。'
    good:
      - '売上の増加分の 7 割は新規事業によるものです。'
  deny_examples:
    - '車のエンジンを整備に出した。'

- id: metaphor/recipe
  severity: warn
  pattern: '(成功|勝利)のレシピ'
  why: 「手順化された方法」の比喩で、手順自体が書かれない。
  ask: 再現可能な手順として書くか、手順の所在を示す。
  examples:
    bad:
      - '本書には成功のレシピが詰まっています。'
    good:
      - '受注までの 5 工程を、各工程のチェックリスト付きで説明します。'
  deny_examples:
    - '祖母から煮物のレシピを教わった。'

- id: metaphor/spice
  severity: warn
  pattern: '(会話|人生|日常|文章)のスパイス'
  why: 「変化を加えるもの」の比喩で、何がどう変わるのかが書かれない。
  ask: 加えた結果の変化を具体的に書く。
  examples:
    bad:
      - 'ユーモアは文章のスパイスです。'
    good:
      - '導入に体験談を 1 つ入れると、離脱率が下がりました。'
  deny_examples:
    - 'カレーにスパイスを 3 種類加えた。'
