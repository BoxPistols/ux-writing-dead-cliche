# 比喩の型 — 抽象概念を物にたとえて、指す対象を曖昧にする表現。
# 「比喩を消す」のではなく、ask の問いに答える情報で置き換える。

- id: metaphor/compass
  severity: error
  pattern: '(?<!船の)(?<!航海の)羅針盤'
  why: 「指針」の比喩として頻出するが、誰がどの判断に使うのかが書かれない。
  ask: 誰が、どの判断を、何を基準に決めるのかを書く。
  examples:
    bad:
      - 'この文書はチームの羅針盤です。'
    good:
      - '実装方針で迷ったときは、この文書の判断基準の節に従う。'
  deny_examples:
    - '博物館で古い船の羅針盤を見た。'

- id: metaphor/heart
  severity: error
  pattern: '(の|たる)心臓部'
  why: 中心的だと言うだけで、なぜ中心なのかが書かれない。
  ask: それが止まったとき、何が動かなくなるのかを書く。
  examples:
    bad:
      - 'この決済モジュールはシステムの心臓部です。'
    good:
      - 'この決済モジュールが止まると、全サービスの売上処理が止まる。'
  deny_examples:
    - '心臓外科の手術は予定どおり終了した。'
    - '心臓の鼓動が速くなった。'

- id: metaphor/backbone
  severity: error
  pattern: '(の|を支える)屋台骨'
  why: 重要性の主張だけで、依存関係の実体が書かれない。
  ask: それが何を支えているのか、依存の向きを具体的に書く。
  examples:
    bad:
      - '認証基盤は全サービスの屋台骨です。'
    good:
      - '認証基盤が止まると、全サービスでログインできなくなる。'
  deny_examples:
    - '祭りの屋台の骨組みを補強した。'

- id: metaphor/dna
  severity: error
  pattern: '(企業|会社|組織|チーム|創業|ブランド|文化|我々|私たち)のDNA'
  why: 組織の性質を生得的なものに見せ、根拠の提示を省く表現。
  ask: その性質が表れた具体的な行動や制度を書く。
  examples:
    bad:
      - '挑戦を恐れないのが我々のDNAです。'
    good:
      - '失敗した実験プロジェクトにも翌年の予算を配分している。'
  deny_examples:
    - 'DNA鑑定の結果が届いた。'

- id: metaphor/cornerstone
  severity: warn
  pattern: 'の礎(と|に|を)'
  why: 「基礎として重要」の言い換えで、何にどう効くのかが書かれない。
  ask: それがないと何ができないのかを書く。
  examples:
    bad:
      - '信頼関係の礎を築くことが第一です。'
    good:
      - '週次の進捗共有を 3 か月続け、遅延の申告が早まった。'
  deny_examples:
    - '発掘調査で礎石の配置が判明した。'

- id: metaphor/two-wheels
  severity: error
  pattern: '車の両輪'
  why: 「両方大事」以上の情報がない。
  ask: それぞれの役割の違いと、連携の実体を書く。
  examples:
    bad:
      - '開発と営業は車の両輪です。'
    good:
      - '開発が仕様を決め、営業が価格を決める。相互レビューを月次で行う。'
  deny_examples:
    - '両輪駆動の模型を組み立てた。'

- id: metaphor/catalyst
  severity: error
  surface:
    - '起爆剤'
    - 'カンフル剤'
  why: 変化のきっかけになると言うだけで、因果の中身が書かれない。
  ask: 何がどう変わる見込みか、根拠と併せて書く。
  examples:
    bad:
      - '新製品が市場拡大の起爆剤となります。'
    good:
      - '新製品の投入後、問い合わせ件数が前月比で 4 割増えた。'
  deny_examples:
    - '雷管と導火線の保管規程を見直した。'

- id: metaphor/bridge
  severity: warn
  pattern: 'の架け橋'
  why: 「つなぐ」の抽象化で、何をどう仲介するのかが書かれない。
  ask: 誰と誰の、どんなやり取りを仲介するのかを書く。
  examples:
    bad:
      - '本事業は地域と企業の架け橋となります。'
    good:
      - '本事業は地域の生産者と企業の調達部門の間で、受発注の窓口を担う。'
  deny_examples:
    - '川に橋を架ける工事が始まった。'

- id: metaphor/signpost
  severity: warn
  pattern: '(人生|経営|判断|キャリア|学び|成長)の道(しるべ|標)'
  why: 「参考になる」の比喩で、何を判断するときに参照するのかが書かれない。
  ask: どの場面で、何を決めるために参照するのかを書く。
  examples:
    bad:
      - 'この本はキャリアの道標になります。'
    good:
      - '転職か昇進かを迷ったとき、この本の第 2 章の基準で比較できる。'
  deny_examples:
    - '登山道の道標を頼りに下山した。'

- id: metaphor/blood-oil
  severity: error
  pattern: '(組織|経済|会社|事業)の血液|新しい石油'
  why: 重要性を資源にたとえるだけで、利用の実体が書かれない。
  ask: 誰がどう使うと何が得られるのかを書く。
  examples:
    bad:
      - 'データは新しい石油と呼ばれています。'
    good:
      - '購買ログを需要予測に使い、欠品率を 2 % 下げた。'
  deny_examples:
    - '血液検査の数値は基準範囲内だった。'

- id: metaphor/hole
  severity: warn
  pattern: '(議論|理論|論理|計画|戦略|制度|防御|理屈)(に|の)は?(大きな)?穴'
  why: 欠陥があると言うだけで、どこがどう欠けているのかが書かれない。
  ask: 欠けている条件・ケース・前提を特定して書く。
  examples:
    bad:
      - 'この計画には大きな穴がある。'
    good:
      - 'この計画は、担当者が不在のときの引き継ぎ手順を定めていない。'
  deny_examples:
    - '壁に穴が開いたので業者に修理を頼んだ。'
    - '穴場の温泉宿を予約した。'

- id: metaphor/gamechanger
  severity: error
  surface:
    - 'ゲームチェンジャー'
  why: 「大きな変化」の主張だけで、何のルールがどう変わるのかが書かれない。
  ask: 従来の前提のうち、何が成り立たなくなるのかを書く。
  examples:
    bad:
      - '生成AIは業界のゲームチェンジャーです。'
    good:
      - '見積もり作成が 2 時間から 10 分になり、営業が当日中に再提案できる。'

- id: metaphor/treasure
  severity: warn
  pattern: 'の宝庫'
  why: 価値があると言うだけで、何をどう取り出せるのかが書かれない。
  ask: そこから具体的に何が得られたか、1 つ例を書く。
  examples:
    bad:
      - 'このログは知見の宝庫です。'
    good:
      - 'このログから障害の前兆パターンを 3 種類抽出できた。'
  deny_examples:
    - '正倉院の宝物庫を見学した。'

- id: metaphor/key
  severity: warn
  pattern: '成功の鍵|鍵を握る'
  why: 重要性の主張だけで、因果の中身が書かれない。
  ask: それがどう結果に効くのか、経路を書く。
  examples:
    bad:
      - 'データ活用が成功の鍵を握っています。'
    good:
      - '在庫データを発注に反映できれば、欠品による機会損失を減らせる。'
  deny_examples:
    - '金庫の鍵を交換した。'
