# 締めの型 — 記事や文書の結びに現れる定型。

- id: closing/mashou
  severity: warn
  pattern: '(していき|してみ|始めてみ|やってみ|考えてみ|見ていき|見てみ|しておき)ましょう'
  why: 行動の主体と最初の1手を書かずに済ませる呼びかけの型。
  ask: 読者が最初にやる具体的な操作を1つ書く。
  examples:
    bad:
      - 'まずは小さく始めてみましょう。'
    good:
      - '最初の作業は、現状の処理時間を1週間計測することです。'
  deny_examples:
    - '来月から新体制を始めます。'

- id: closing/ikaga
  severity: error
  surface:
    - 'いかがでしたか'
    - 'いかがだったでしょうか'
  why: 内容の要約を放棄した定型の結び。
  ask: 削るか、本文の要点を1文で再掲する。
  examples:
    bad:
      - 'いかがでしたか。'
    good:
      - '本稿の手順は、導入、設定、検証の3段階です。'

- id: closing/motomerareteiru
  severity: warn
  pattern: 'が求められて(います|いる)'
  why: 要求の主体を消して、一般論に見せる型。
  ask: 誰が誰に何を求めているのかを書く。
  examples:
    bad:
      - '変化に対応できる人材が求められています。'
    good:
      - '採用計画では、来期までにデータ分析の担当を2名増やします。'
  deny_examples:
    - '応募には3年以上の実務経験が求められます。'

- id: closing/me-ga-hanasenai
  severity: error
  pattern: '(目が離せ|見逃せ)(ません|ない)'
  why: 続報への期待を煽るだけの定型。
  ask: 次に何が起きる予定なのか、事実を書く。
  examples:
    bad:
      - '今後の動向から目が離せません。'
    good:
      - '次回の仕様改定は4月に予定されています。'

- id: closing/first-step
  severity: warn
  pattern: '(第一歩|最初の一歩)を踏み出'
  why: 開始の宣言だけで、最初の行動が書かれない。
  ask: 最初にやる作業を具体的に書く。
  examples:
    bad:
      - '変革への第一歩を踏み出しましょう。'
    good:
      - '最初の作業として、現行業務の所要時間を部署ごとに記録します。'
  deny_examples:
    - '富士登山の第一歩は装備の点検だ。'

- id: closing/kitai
  severity: warn
  pattern: '期待が高まり'
  why: 期待の主体が書かれていない。
  ask: 誰が何を予定・計画しているのかを書く。
  examples:
    bad:
      - '今後の展開に期待が高まります。'
    good:
      - '運営は来季、対象地域を3県から10県に広げる計画を公表しました。'

- id: closing/mugen
  severity: error
  pattern: '可能性は無限|無限の可能性'
  why: 見通しの検討を放棄した誇張。
  ask: 現実に予定・検討されている用途を書く。
  examples:
    bad:
      - '活用の可能性は無限に広がっています。'
    good:
      - '現在は物流と医療の2分野で実証実験が進んでいます。'

- id: closing/zehi
  severity: warn
  pattern: 'ぜひ[^。\n]{0,15}(してみて|お試し|ご覧|チェックして)ください'
  why: 記事の締めの定型の勧誘。行動の入口を書けば勧誘は要らない。
  ask: 読者が最初に踏む具体的な手順 (URL・画面・コマンド) を書く。
  examples:
    bad:
      - 'ぜひ一度お試しください。'
    good:
      - '設定画面の「実験的機能」から有効化できます。'
  deny_examples:
    - 'ぜひご出席ください。'

- id: closing/mite-wa-ikaga
  severity: warn
  pattern: 'してみてはいかがでし'
  why: 提案をぼかす締めの定型。
  ask: 提案の条件と手順を書いて、判断は読み手に渡す。
  examples:
    bad:
      - '導入を検討してみてはいかがでしょうか。'
    good:
      - '無料枠で1週間試せます。既存の設定は変更されません。'

- id: closing/oyomi-arigatou
  severity: warn
  pattern: '最後まで(お読み|ご覧)いただきありがとう'
  why: 締めの定型の謝辞。内容の要約の方が読み手に残る。
  ask: 削るか、本文の要点を1文で再掲する。
  examples:
    bad:
      - '最後までお読みいただきありがとうございました。'
    good:
      - '本稿の手順は、導入、設定、検証の3つです。'

- id: closing/wadai
  severity: info
  pattern: '(注目|話題)を(集めて|呼んで)い(ます|る)'
  why: 話題性で価値を代弁する定型。誰の間での話題かが書かれない。
  ask: 導入数・利用者数など、観測できる事実で書く。
  examples:
    bad:
      - '生成AIが注目を集めています。'
    good:
      - '国内企業の生成AI導入率は4割です (2026年調査)。'
