# 締めの型 — 記事や文書の結びに現れる定型。

- id: closing/mashou
  severity: warn
  pattern: '(していき|してみ|始めてみ|やってみ)ましょう'
  why: 行動の主体と最初の 1 手を書かずに済ませる呼びかけの型。
  ask: 読者が最初にやる具体的な操作を 1 つ書く。
  examples:
    bad:
      - 'まずは小さく始めてみましょう。'
    good:
      - '最初の作業は、現状の処理時間を 1 週間計測することである。'
  deny_examples:
    - '来月から新体制を始めます。'

- id: closing/ikaga
  severity: error
  surface:
    - 'いかがでしたか'
    - 'いかがだったでしょうか'
  why: 内容の要約を放棄した定型の結び。
  ask: 削るか、本文の要点を 1 文で再掲する。
  examples:
    bad:
      - 'いかがでしたか。'
    good:
      - '本稿の手順は、導入、設定、検証の 3 段階である。'

- id: closing/motomerareteiru
  severity: warn
  pattern: 'が求められて(います|いる)'
  why: 要求の主体を消して、一般論に見せる型。
  ask: 誰が誰に何を求めているのかを書く。
  examples:
    bad:
      - '変化に対応できる人材が求められています。'
    good:
      - '採用計画では、来期までにデータ分析の担当を 2 名増やす。'
  deny_examples:
    - '応募には 3 年以上の実務経験が求められます。'

- id: closing/me-ga-hanasenai
  severity: error
  pattern: '(目が離せ|見逃せ)(ません|ない)'
  why: 続報への期待を煽るだけの定型。
  ask: 次に何が起きる予定なのか、事実を書く。
  examples:
    bad:
      - '今後の動向から目が離せません。'
    good:
      - '次回の仕様改定は 4 月に予定されている。'

- id: closing/first-step
  severity: warn
  pattern: '(第一歩|最初の一歩)を踏み出'
  why: 開始の宣言だけで、最初の行動が書かれない。
  ask: 最初にやる作業を具体的に書く。
  examples:
    bad:
      - '変革への第一歩を踏み出しましょう。'
    good:
      - '最初の作業として、現行業務の所要時間を部署ごとに記録する。'
  deny_examples:
    - '富士登山の第一歩は装備の点検だ。'

- id: closing/kitai
  severity: warn
  pattern: '期待が高まり'
  why: 期待の主体が書かれていない。
  ask: 誰が何を予定・計画しているのかを書く。
  examples:
    bad:
      - '今後の展開に期待が高まります。'
    good:
      - '運営は来季、対象地域を 3 県から 10 県に広げる計画を公表した。'

- id: closing/mugen
  severity: error
  pattern: '可能性は無限'
  why: 見通しの検討を放棄した誇張。
  ask: 現実に予定・検討されている用途を書く。
  examples:
    bad:
      - '活用の可能性は無限に広がっています。'
    good:
      - '現在は物流と医療の 2 分野で実証実験が進んでいる。'
