# 翻訳調・冗長 — 英語からの直訳に由来する回りくどい型。

- id: translationese/koto-ga-dekimasu
  severity: warn
  fix: 'でき$1'
  pattern: 'することができ(ます|る)'
  why: 「できます」で足りる冗長形。
  ask: 「〜できます」に短くする。
  examples:
    bad:
      - 'ボタンひとつで削除することができます。'
    good:
      - 'ボタンひとつで削除できます。'
  deny_examples:
    - 'この列は削除することができない仕様になっている。'

- id: translationese/kanou-desu
  severity: warn
  pattern: 'することが可能(です|になります)'
  why: 「できます」で足りる冗長形。
  ask: 「〜できます」に短くする。
  examples:
    bad:
      - 'CSV形式で出力することが可能です。'
    good:
      - 'CSV形式で出力できます。'

- id: translationese/watashitachi
  severity: warn
  pattern: '^私たちは'
  why: 英語の We に由来する書き出し。主体がぼやける。
  ask: 主語を組織名・チーム名など具体にするか、省く。
  examples:
    bad:
      - '私たちは、顧客体験の向上に取り組んでいます。'
    good:
      - '開発チームは、問い合わせ導線の改修を進めています。'
  deny_examples:
    - '調査の結果、私たちは当初の仮説を棄却した。'

- id: translationese/to-ieru
  severity: warn
  pattern: 'と言える(でしょう|かもしれません)'
  why: 判断の主体と条件を曖昧にするぼかし表現。
  ask: 言い切るか、成立する条件を書く。
  examples:
    bad:
      - 'この施策は成功だったと言えるでしょう。'
    good:
      - '目標の登録数 1,000 件に対し、実績は 1,240 件でした。'

- id: translationese/mono-to-narimasu
  severity: warn
  pattern: 'もの(と|に)なります'
  why: 「なります」で足りる冗長形。主体が消える。
  ask: 「〜になります」か、動作主のある文にする。
  examples:
    bad:
      - '本機能は今後の開発の土台となるものとなります。'
    good:
      - '今後の機能は本機能の API を使って実装します。'

- id: translationese/teiku-juyou
  severity: error
  pattern: 'していくことが(重要|大切|必要|求められ)'
  why: 具体的な行動計画を書かずに済ませる定型。
  ask: 誰が、何を、どの頻度でやるのかを書く。
  examples:
    bad:
      - '継続的に改善していくことが重要です。'
    good:
      - '毎週金曜に計測結果を確認し、悪化した指標を翌週の改善対象にします。'

- id: translationese/koto-ni
  severity: warn
  pattern: '(興味深い|驚くべき|幸いな|不思議な)ことに、'
  why: Interestingly, などの文頭副詞の直訳。評価を先に置いて根拠を後回しにする。
  ask: 評価語を削り、興味深いと感じた事実そのものを書く。
  examples:
    bad:
      - '興味深いことに、この手法は日本語でも機能します。'
    good:
      - 'この手法は日本語でも機能します。英語との違いは分かち書きの有無だけです。'
  deny_examples:
    - '困ったことに、鍵を忘れた。'

- id: translationese/kanou-ni-shimasu
  severity: warn
  pattern: 'することを可能に(し|する)'
  why: enable の直訳の冗長形。
  ask: 「〜できます」に短くする。
  examples:
    bad:
      - '大量の文書を横断検索することを可能にします。'
    good:
      - '大量の文書を横断検索できます。'

- id: translationese/juuyou-yakuwari
  severity: warn
  pattern: '重要な役割を果た'
  why: plays an important role の直訳。役割の中身が書かれない。
  ask: 何を担っているのかを動詞で書く。
  examples:
    bad:
      - 'テストは品質保証で重要な役割を果たします。'
    good:
      - 'テストは退行の検出を担います。リリース前の唯一の検出手段です。'

- id: translationese/iu-made-mo-naku
  severity: info
  pattern: '言うまでもなく|言うまでもありませんが'
  why: needless to say の直訳。言うまでもないなら書かなくてよい。
  ask: 削るか、根拠として必要なら普通の文で書く。
  examples:
    bad:
      - '言うまでもなく、テストは重要です。'
    good:
      - 'テストがないと、退行をリリース後まで検出できません。'
