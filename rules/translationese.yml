# 翻訳調・冗長 — 英語からの直訳に由来する回りくどい型。

- id: translationese/koto-ga-dekimasu
  severity: warn
  fix: 'でき$1'
  pattern: 'することができ(ます|る)'
  why: 「できます」で足りる冗長形。
  ask: 「〜できます」に短くする。
  examples:
    bad:
      - 'ボタンひとつで削除することができます。'
    good:
      - 'ボタンひとつで削除できます。'
  deny_examples:
    - 'この列は削除することができない仕様になっている。'

- id: translationese/kanou-desu
  severity: warn
  pattern: 'することが可能(です|である|だ|になります|になる)'
  why: 「できます」で足りる冗長形。
  ask: 「〜できます」に短くする。
  examples:
    bad:
      - 'CSV形式で出力することが可能です。'
      - 'CSV形式で出力することが可能である。'
    good:
      - 'CSV形式で出力できます。'

- id: translationese/watashitachi
  severity: warn
  pattern: '^私たちは'
  why: 英語のWeに由来する書き出し。主体がぼやける。
  ask: 主語を組織名・チーム名など具体にするか、省く。
  examples:
    bad:
      - '私たちは、顧客体験の向上に取り組んでいます。'
    good:
      - '開発チームは、問い合わせ導線の改修を進めています。'
  deny_examples:
    - '調査の結果、私たちは当初の仮説を棄却した。'

- id: translationese/to-ieru
  severity: warn
  pattern: 'と言える(でしょう|かもしれません)'
  why: 判断の主体と条件を曖昧にするぼかし表現。
  ask: 言い切るか、成立する条件を書く。
  examples:
    bad:
      - 'この施策は成功だったと言えるでしょう。'
    good:
      - '目標の登録数1,000件に対し、実績は1,240件でした。'

- id: translationese/mono-to-narimasu
  severity: warn
  pattern: 'もの(と|に)な(ります|る)'
  why: 「なります」で足りる冗長形。主体が消える。
  ask: 「〜になります」か、動作主のある文にする。
  examples:
    bad:
      - '本機能は今後の開発の土台となるものとなります。'
      - '本機能は今後の開発の土台となるものとなる。'
    good:
      - '今後の機能は本機能のAPIを使って実装します。'

- id: translationese/teiku-juyou
  severity: error
  pattern: 'していくことが(重要|大切|必要|求められ)'
  why: 具体的な行動計画を書かずに済ませる定型。
  ask: 誰が、何を、どの頻度でやるのかを書く。
  examples:
    bad:
      - '継続的に改善していくことが重要です。'
    good:
      - '毎週金曜に計測結果を確認し、悪化した指標を翌週の改善対象にします。'

- id: translationese/koto-ni
  severity: warn
  pattern: '(興味深い|驚くべき|幸いな|不思議な)ことに、'
  why: Interestingly, などの文頭副詞の直訳。評価を先に置いて根拠を後回しにする。
  ask: 評価語を削り、興味深いと感じた事実そのものを書く。
  examples:
    bad:
      - '興味深いことに、この手法は日本語でも機能します。'
    good:
      - 'この手法は日本語でも機能します。英語との違いは分かち書きの有無だけです。'
  deny_examples:
    - '困ったことに、鍵を忘れた。'

- id: translationese/kanou-ni-shimasu
  severity: warn
  pattern: 'することを可能に(し|する)'
  why: enableの直訳の冗長形。
  ask: 「〜できます」に短くする。
  examples:
    bad:
      - '大量の文書を横断検索することを可能にします。'
    good:
      - '大量の文書を横断検索できます。'

- id: translationese/juuyou-yakuwari
  severity: warn
  pattern: '重要な役割を果た'
  why: plays an important roleの直訳。役割の中身が書かれない。
  ask: 何を担っているのかを動詞で書く。
  examples:
    bad:
      - 'テストは品質保証で重要な役割を果たします。'
    good:
      - 'テストは退行の検出を担います。リリース前の唯一の検出手段です。'

- id: translationese/iu-made-mo-naku
  severity: info
  pattern: '言うまでも(なく|ない|ありませんが|ありません)'
  why: needless to sayの直訳。言うまでもないなら書かなくてよい。
  ask: 削るか、根拠として必要なら普通の文で書く。
  examples:
    bad:
      - '言うまでもなく、テストは重要です。'
      - '言うまでもないが、テストは重要だ。'
    good:
      - 'テストがないと、退行をリリース後まで検出できません。'

- id: translationese/han
  severity: error
  fix: 'バージョン'
  # 「版」が単独で立つ形だけを拾う。直前が漢字・カタカナ・英数字の複合語
  # (初版・第3版・日本語版・Pro版) と、直後が漢字の語 (版画・版元・版権) は対象外。
  # 書籍の「版を重ねる」も正当な用法として除外する
  pattern: '(?<![\p{Script=Han}\p{Script=Katakana}ーA-Za-z0-9０-９])版(?!を重ね)(?=[でをにがはとのもへや]|から|まで|より|上げ|です|でした|だ|。|、|$)'
  why: 開発の文脈では「バージョン」と言い、漢字1文字の「版」は使わない。翻訳文に由来する言い方で、読み手が引っかかる。
  ask: 「バージョン」と書く。
  examples:
    bad:
      - '今回はこの版で固定します。'
      - '前回の版との差分を確認します。'
      - '新しい版を上げました。'
    good:
      - '今回はこのバージョンで固定します。'
      - '前回のバージョンとの差分を確認します。'
  deny_examples:
    - 'この本は第3版で内容が改められた。'
    - '初版から誤植が残っている。'
    - 'Wikipedia日本語版を参照した。'
    - '版画の展示を見に行った。'
    - 'この本は版を重ねて10万部に達した。'
    - '出版社に原稿を送った。'
