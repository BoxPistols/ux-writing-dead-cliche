# 空虚な抽象 — 具体を書かずに大きな概念で覆う表現。

- id: empty-abstraction/essence
  severity: warn
  pattern: 'の本質(です|だ|である|と言え|に迫)|本質的には'
  why: 「本質」と言うことで、具体的な説明を省いている。
  ask: 本質と呼んでいる内容を、観察できる事実か手順で書く。
  examples:
    bad:
      - 'ユーザー理解こそがUXの本質です。'
    good:
      - 'UX改善は、ユーザーの誤操作の観察から始めます。'
  deny_examples:
    - '両者の本質的な違いは初期化の順序にある。'

- id: empty-abstraction/shinzui
  severity: error
  surface:
    - '真髄'
    - '神髄'
  why: 深さの主張だけで、中身が書かれない。
  ask: 具体的に何を学べるのか、1つ例を書く。
  examples:
    bad:
      - 'アジャイル開発の真髄に触れる内容です。'
    good:
      - 'スプリントの分割単位を、機能ではなく検証したい仮説で決める方法を扱います。'

- id: empty-abstraction/core
  severity: warn
  pattern: '核心を突く|の核心に迫|核心(です|は)'
  why: 「重要な点に触れている」の主張だけで、その点自体が書かれない。
  ask: 核心と呼んでいる内容を明示する。
  examples:
    bad:
      - '問題の核心に迫る分析です。'
      - 'この設計こそが核心です。'
      - 'このアプリの核心は検索機能です。'
    good:
      - '障害の再発は、監視ではなくデプロイ手順の属人化に起因していました。'
  deny_examples:
    - '核心的利益をめぐる交渉が続いた。'

- id: empty-abstraction/paradigm
  severity: error
  surface:
    - 'パラダイムシフト'
  why: 変化の大きさの主張だけで、何がどう変わるのかが書かれない。
  ask: 変わる前と後の前提を並べて書く。
  examples:
    bad:
      - '開発プロセスのパラダイムシフトが起きています。'
    good:
      - '手動テストの工程がなくなり、リリース周期が月次から週次になりました。'

- id: empty-abstraction/synergy
  severity: warn
  surface:
    - 'シナジー'
  why: 相乗効果の主張だけで、何と何がどう組み合わさるのかが書かれない。
  ask: 掛け合わせの実体と、期待する効果の経路を書く。
  examples:
    bad:
      - '両事業のシナジーを追求します。'
    good:
      - '両事業で顧客リストを共用し、営業の重複訪問をなくします。'

- id: empty-abstraction/sublimation
  severity: error
  pattern: 'を昇華(さ|し)'
  why: 変換の中身を書かずに、質の向上を主張する表現。
  ask: 何をどう変換して、何に反映したのかを書く。
  examples:
    bad:
      - '悔しさを昇華させて次の設計に活かした。'
    good:
      - '障害対応で得た再発防止策3件を、次期版の設計要件に加えました。'
  deny_examples:
    - 'ドライアイスが昇華して白い気体のように見えた。'

- id: empty-abstraction/daigomi
  severity: warn
  surface:
    - '醍醐味'
  why: 魅力の主張だけで、何が面白いのかが書かれない。
  ask: 面白さの実体を、具体的な場面で書く。
  examples:
    bad:
      - 'これぞ設計の醍醐味です。'
    good:
      - '制約が矛盾したとき、どちらを捨てるかの判断が設計の面白さです。'

- id: empty-abstraction/worldview
  severity: warn
  pattern: '(独自|唯一無二)の世界観'
  why: 独自性の主張だけで、何が独自なのかが書かれない。
  ask: 他と異なる具体的な特徴を1つ書く。
  examples:
    bad:
      - '独自の世界観を持つプロダクトです。'
    good:
      - '全画面を手描きのイラストで構成し、写真素材を使っていません。'
  deny_examples:
    - 'ゲームの世界観設定を資料にまとめた。'

- id: empty-abstraction/story
  severity: error
  pattern: '新たな物語|物語(が始ま|を紡)|(時代|歴史|新章)の幕開け'
  why: 期待感の演出で、計画の中身が書かれない。
  ask: 次に何をするのか、最初の1手を書く。
  examples:
    bad:
      - 'ここから新たな物語が始まります。'
    good:
      - '来月から、まず九州3県で実証実験を始めます。'
  deny_examples:
    - '物語の構造を分析する研究が進んでいる。'

- id: empty-abstraction/shinka
  severity: warn
  pattern: 'を深化さ'
  why: 「深める」の抽象化で、何がどう変わるのかが書かれない。
  ask: 深まった状態を、行動や成果物の変化で書く。
  examples:
    bad:
      - '議論を深化させる場になった。'
    good:
      - '論点を3つに絞り、それぞれに反対意見を集めました。'
  deny_examples:
    - '進化の過程を系統樹で確認した。'

- id: empty-abstraction/kachi-teikyou
  severity: warn
  pattern: '(価値|体験|感動)を(提供|お届け)'
  why: 企業文の定型。提供物の実体が書かれない。
  ask: 何を、誰に、どう役立つ形で渡すのかを書く。
  examples:
    bad:
      - '新しい価値を提供します。'
    good:
      - '手作業だった集計を自動化し、月20時間を減らします。'
  deny_examples:
    - '昼食を提供する施設を運営している。'

- id: empty-abstraction/yorisou
  severity: warn
  pattern: '(顧客|お客様|ユーザー|利用者|一人ひとり)に寄り添'
  why: 姿勢の表明だけで、行動が書かれない。
  ask: 寄り添うと呼んでいる行動 (対応時間・選択肢・例外処理) を書く。
  examples:
    bad:
      - 'お客様一人ひとりに寄り添ったサービスです。'
    good:
      - '問い合わせには担当者が1営業日以内に返信します。定型の自動返信は使いません。'
  deny_examples:
    - '入院中の祖母に寄り添って過ごした。'

- id: empty-abstraction/omoi-katachi
  severity: warn
  pattern: '想いを(形|カタチ)に'
  why: 制作の常套句。想いの中身も形の中身も書かれない。
  ask: 誰の何の要望を、どんな仕様にしたのかを書く。
  examples:
    bad:
      - 'お客様の想いをカタチにします。'
    good:
      - '要望を仕様書に起こし、着工前に3Dモデルで確認してもらいます。'
  deny_examples:
    - '故人への思いを形にした記念碑が建った。'

- id: empty-abstraction/jitsugen-kouken
  severity: warn
  pattern: '(社会|未来|世界)の実現に(貢献|寄与)'
  why: 目的の連鎖を大きな言葉で打ち切る定型。自社の行動が書かれない。
  ask: 自分たちが何をするのかを、観測できる粒度で書く。
  examples:
    bad:
      - '持続可能な社会の実現に貢献します。'
    good:
      - '製造工程の電力使用量を2030年までに3割減らします。'

- id: empty-abstraction/shugyoku
  severity: warn
  pattern: '珠玉の'
  why: 質の高さの主張だけで、選定基準が書かれない。
  ask: 何を基準に選んだのかを書く。
  examples:
    bad:
      - '珠玉のテクニック集です。'
    good:
      - '実案件で使った12の手法を、失敗例と併せて載せています。'

- id: empty-abstraction/minshuka
  severity: warn
  pattern: '(AI|技術|データ|開発|情報|知識)を民主化'
  why: democratizeの直訳。誰が何をできるようになるのかが書かれない。
  ask: これまでできなかった誰が、何をできるようになるのかを書く。
  examples:
    bad:
      - 'AIを民主化するプラットフォームです。'
    good:
      - 'プログラミング経験がなくても、画面操作だけで分類モデルを作れます。'
  deny_examples:
    - '選挙制度の民主化を求める運動が起きた。'
