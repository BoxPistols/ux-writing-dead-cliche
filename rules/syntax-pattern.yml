# 構文の型 — 語彙ではなく文の形に表れるクリシェ。

- id: syntax-pattern/not-just
  severity: error
  pattern: '単なる[^。\n]{1,25}では(なく|ありません)'
  why: 対象を持ち上げるための定型で、比較の中身がない。
  ask: 「単なるX」との差分を具体的に書く。差分が書けないなら削る。
  examples:
    bad:
      - 'これは単なるツールではなく、開発の思想です。'
    good:
      - 'このツールは依存関係の解決を自動化します。設定ファイルは不要になります。'
  deny_examples:
    - '原因は単なる誤記だった。'

- id: syntax-pattern/sore-wa
  severity: warn
  pattern: '。それは、?[^。\n]{1,30}(です|である|だ)。'
  why: もったいぶった定義の型。一文で言える内容を引き延ばしている。
  ask: 一文にまとめる。
  examples:
    bad:
      - '私たちには使命があります。それは、顧客の時間を取り戻すことです。'
    good:
      - '当社の使命は、顧客の作業時間を減らすことです。'
  deny_examples:
    - 'それは検証済みです。'

- id: syntax-pattern/rhetorical-question
  severity: warn
  pattern: '(の|べき)ではないでしょうか'
  why: 主張を疑問形に包んで、根拠の提示を避ける型。
  ask: 主張として言い切り、根拠を添える。
  examples:
    bad:
      - 'そろそろ設計を見直すべきではないでしょうか。'
    good:
      - '設計を見直す時期です。変更要求の 6 割が現行構造と衝突しています。'
  deny_examples:
    - '「これは仕様ではないですか」と質問が来た。'

- id: syntax-pattern/antithesis
  severity: warn
  pattern: 'ではない。[^。\n]{0,25}(なのだ|のです|なのです)。'
  why: 否定と断定の対句で高揚感を作る型。情報は増えていない。
  ask: 事実の文に戻す。
  examples:
    bad:
      - 'これは終わりではない。新しい始まりなのだ。'
    good:
      - '本プロジェクトは終了し、運用は保守チームへ移管します。'
  deny_examples:
    - '今回の対象ではない。詳細は付録に記載した。'

- id: syntax-pattern/dash-definition
  severity: warn
  pattern: '(――|——)それは'
  why: ダッシュで溜めて定義を出す演出の型。
  ask: 「XはYである」の形で書く。
  examples:
    bad:
      - '品質――それは全員の責任です。'
    good:
      - '品質の最終確認は、職種を問わず全員が担います。'

- id: syntax-pattern/taigen-run
  severity: warn
  manual: true
  why: 体言止めを連打すると、断定の主体と根拠が文から消える。
  ask: 各文に主語と述語を戻し、事実の文にする。
  examples:
    bad:
      - '圧倒的なスピード。洗練された体験。選ばれる理由。'
    good:
      - '処理は平均 0.4 秒で完了し、操作は 3 手順で終わります。'

- id: syntax-pattern/triple-list
  severity: info
  manual: true
  why: 内容が 2 点でも 4 点でも 3 点に丸める癖。点の数が内容より先に決まっている。
  ask: 点の数は内容に合わせる。並列でないものを並列にしない。
  examples:
    bad:
      - '速い・安い・美しいの三拍子そろったツールです。'
    good:
      - '処理が速く、無料枠で運用できます。UI の評価は利用者調査を待って判断します。'

- id: syntax-pattern/colon-predicate
  severity: warn
  pattern: '(です|ます|した)[:：]$'
  why: 述語で終わる文にコロンを付ける型 (「実行します:」)。日本語の文の切れ目と記号が衝突する。
  ask: 名詞止め (「実行するコマンド:」) にするか、コロンを句点にする。
  refs:
    - 'textlint-rule-preset-ai-writing (MIT) と同観点の独自実装 (形態素解析なしの近似)'
  examples:
    bad:
      - '次のコマンドを実行します:'
    good:
      - '実行するコマンド:'
  deny_examples:
    - '主な設定項目:'

- id: syntax-pattern/sore-dake-dewa
  severity: warn
  pattern: 'それだけではありません'
  why: 続きを演出する定型。並列で書けば足りる。
  ask: 「AとBの両方」の形で 1 文にまとめる。
  examples:
    bad:
      - '処理が速くなりました。しかし、それだけではありません。'
    good:
      - '処理速度に加えて、メモリ使用量も半分になりました。'

- id: syntax-pattern/gozonji
  severity: warn
  pattern: 'をご存(知|じ)でしょうか'
  why: 記事導入の定型の問いかけ。答えを書けば要らない。
  ask: 問いをやめて、その事実から書き始める。
  examples:
    bad:
      - 'この設定項目をご存知でしょうか。'
    good:
      - 'この設定項目は、検索結果の並び順を変えます。'

- id: syntax-pattern/souzou-shite
  severity: error
  pattern: '想像してみてください'
  why: Imagine の直訳。読者への指示で事実の提示を代替している。
  ask: 想像させたい状態を、実績か仕様として書く。
  examples:
    bad:
      - '想像してみてください。会議が 10 分で終わる世界を。'
    good:
      - '導入した部署では、定例会議が平均 25 分から 10 分になりました。'

- id: syntax-pattern/youkoso
  severity: error
  pattern: 'の世界へようこそ'
  why: 記事導入の定型。内容の説明になっていない。
  ask: この文書で何を扱うのかを最初の文で書く。
  examples:
    bad:
      - '3D プリントの世界へようこそ。'
    good:
      - '本連載は 3D プリントの始め方を扱います。今回は機種選びです。'

- id: syntax-pattern/himotoku
  severity: warn
  pattern: '(謎|秘密|魅力|仕組み|舞台裏)を紐解'
  why: メディアの定型。分析の中身が書かれない。
  ask: 何をどう調べて、何が分かるのかを書く。
  examples:
    bad:
      - '人気の秘密を紐解きます。'
    good:
      - 'リピート率の高い店舗 10 件を訪問し、共通する接客手順を記録しました。'
  deny_examples:
    - '江戸期の古文書を紐解いた。'

- id: syntax-pattern/semaru
  severity: info
  pattern: '(魅力|実態|素顔|舞台裏)に迫(る|り)'
  why: メディアの定型見出し。何が分かるのかが書かれない。
  ask: 読み終えたときに分かることを書く。
  examples:
    bad:
      - '開発現場の実態に迫ります。'
    good:
      - '開発チーム 5 人に、リリース前 1 週間の作業時間を聞きました。'

- id: syntax-pattern/ichigai
  severity: warn
  pattern: '一概には言えません'
  why: 条件を書かずに判断を保留する保険の定型。
  ask: どの条件なら成り立ち、どの条件なら成り立たないのかを書く。
  examples:
    bad:
      - '効果は一概には言えませんが、有効な手法です。'
    good:
      - 'データが 1 万件を超える場合に有効です。それ未満では差が出ませんでした。'

- id: syntax-pattern/merit-demerit
  severity: warn
  pattern: 'メリットもあればデメリットも'
  why: 両論あることを言うだけで、どちらの中身も書かれない。
  ask: 主要な利点と欠点を 1 つずつ、具体的に書く。
  examples:
    bad:
      - 'この方式にはメリットもあればデメリットもあります。'
    good:
      - 'この方式は設定が 1 分で済みます。一方、細かい権限管理はできません。'

- id: syntax-pattern/opener
  severity: warn
  pattern: '(解説|紹介|深掘り)していきます'
  why: Web 記事の定型の予告。予告より内容を先に出す方が読み手に残る。
  ask: 「〜を扱います」と言い切るか、最初の情報をすぐ書く。
  examples:
    bad:
      - '本記事では設定方法を解説していきます。'
    good:
      - '本記事は設定方法を扱います。手順は 3 段階です。'
