<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dead-cliche</title>
<meta name="description" content="日本語テキストを貼ると、AI特有のクリシェを検出して直せるエディタ。入力はどこにも送信されません。">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="6" fill="%232A4B7C"/><path d="M8 11h16M8 21h16" stroke="%23F6F6F3" stroke-width="2.6"/><path d="M8 16h11" stroke="%23F6F6F3" stroke-width="2.6"/><path d="M22 13.4l5.2 5.2M27.2 13.4L22 18.6" stroke="%23E07A5F" stroke-width="2.6"/></svg>'>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./design-tokens.css">
<style>
header { border-bottom: 1px solid var(--line); padding: 16px 20px; }
.wrap { max-width: 1160px; margin: 0 auto; }
.head-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-mono); font-size: var(--fs-l); font-weight: 700; margin: 0; color: var(--indigo); }
.head-row .sub { color: var(--ink-soft); font-size: var(--fs-s); }
.head-row nav { margin-left: auto; font-size: var(--fs-s); display: flex; gap: 14px; }
main { max-width: 1160px; margin: 0 auto; padding: 16px 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
.pane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pane-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pane-head strong { font-size: var(--fs-s); letter-spacing: .05em; color: var(--ink-soft); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: inherit; font-size: var(--fs-min); cursor: pointer; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink-soft); padding: 3px 12px; }
.chip[aria-pressed="true"] { background: var(--indigo); border-color: var(--indigo); color: var(--paper); }
textarea {
  width: 100%; min-height: 46vh; resize: vertical;
  font: inherit; font-size: var(--fs-base); line-height: 1.9;
  color: var(--ink); background: var(--card);
  border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px;
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-size: var(--fs-s); font-weight: 700; cursor: pointer; border-radius: var(--radius); padding: 8px 14px; border: 1px solid var(--indigo); }
.primary { background: var(--indigo); color: var(--paper); }
.ghost { background: transparent; color: var(--indigo); }
button:disabled { opacity: .45; cursor: default; }
button.done { background: var(--green); border-color: var(--green); color: var(--paper); }
.summary { font-size: var(--fs-s); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.summary .err { color: var(--shu); font-weight: 700; }
.findings { display: flex; flex-direction: column; gap: 8px; }
.finding { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; }
.finding .top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.finding .expr { font-family: var(--font-mono); font-weight: 700; background: var(--mono-bg); border-radius: 3px; padding: 1px 8px; }
.finding .loc { color: var(--ink-soft); font-size: var(--fs-min); font-variant-numeric: tabular-nums; }
.tag { font-size: var(--fs-min); border: 1px solid var(--line); border-radius: 3px; padding: 0 7px; color: var(--ink-soft); }
.tag.err { color: var(--shu); }
.tag.wrn { color: var(--amber); }
.tag.fix { color: var(--green); }
.finding .ask { font-size: var(--fs-s); margin: 0; }
.finding .ask b { color: var(--indigo); margin-right: 4px; }
.allclear { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 16px; color: var(--green); font-weight: 700; }
.preset-note { margin: 0; font-size: var(--fs-min); color: var(--ink-soft); }
.example { font-size: var(--fs-s); color: var(--ink-soft); }
.example b { color: var(--ink-soft); font-weight: 500; font-size: var(--fs-min); letter-spacing: .04em; }
.example p { margin: 2px 0 0; padding-left: 1.4em; text-indent: -1.4em; }
.example .ex-bad::before { content: "× "; color: var(--shu); font-weight: 700; }
.example .ex-good::before { content: "○ "; color: var(--green); font-weight: 700; }
.example .ex-good { color: var(--ink); }
.empty { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; align-items: start; }
.empty p { margin: 0; font-size: var(--fs-s); color: var(--ink-soft); }
.why { font-size: var(--fs-s); color: var(--ink-soft); }
.hint { margin: 0; font-size: var(--fs-s); color: var(--ink-soft); }
del { color: var(--shu); text-decoration: line-through; font-family: var(--font-mono); background: var(--mono-bg); border-radius: 3px; padding: 0 5px; }
ins { color: var(--green); text-decoration: none; font-family: var(--font-mono); background: var(--mono-bg); border-radius: 3px; padding: 0 5px; }
.applied { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 10px 14px; font-size: var(--fs-s); }
.applied summary { cursor: pointer; color: var(--green); font-weight: 700; }
.applied p { margin: 6px 0 0; }
.guards { border-top: 1px solid var(--line); margin-top: 8px; padding-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.guards span { font-size: var(--fs-min); color: var(--ink-soft); letter-spacing: .04em; }
footer { max-width: 1160px; margin: 0 auto; padding: 0 20px 40px; color: var(--ink-soft); font-size: var(--fs-min); }
footer a { color: var(--indigo); }
@media (prefers-reduced-motion: no-preference) { button { transition: background .2s; } }
</style>
</head>
<body>
<header>
  <div class="wrap head-row">
    <h1>dead-cliche</h1>
    <span class="sub">辞書にあるAI特有の言い回しだけを検出します (文章の良し悪しは判定しません)。入力はどこにも送信されません</span>
    <nav><a href="./rules.html">辞書を引く</a><a href="./proposal-form.html">提案</a></nav>
  </div>
</header>
<main>
  <section class="pane">
    <div class="pane-head">
      <strong>テキスト</strong>
      <div class="chips" id="presets" role="group" aria-label="プリセット"></div>
    </div>
    <p class="preset-note" id="preset-note"></p>
    <textarea id="src" autofocus placeholder="ここに文章を貼ってください。PR本文、issue、Wiki、記事、コミットメッセージ、何でも検査できます。"></textarea>
    <div class="actions">
      <button class="primary" id="autofix" disabled>自動修正を適用</button>
      <button class="ghost" id="copy-text" disabled>本文をコピー</button>
      <button class="ghost" id="copy-inst" disabled>残りをAIに直させる指示文をコピー</button>
    </div>
    <p class="hint" id="hint"></p>
    <div class="guards" id="guards"><span>貼るだけの指示文</span></div>
  </section>
  <section class="pane">
    <div class="pane-head"><strong>検出</strong><span class="summary" id="summary"></span></div>
    <div class="findings" id="findings" aria-live="polite"></div>
  </section>
</main>
<footer>
  判定は<a href="https://github.com/BoxPistols/ux-writing-dead-cliche">CLIと同じエンジン</a>がブラウザ内で実行します。
  厳密な運用(フック・CI・PRレビュー)はClaude Codeプラグインが担います。デザイン規範は<a href="https://github.com/BoxPistols/ux-writing-dead-cliche/blob/main/DESIGN.md">DESIGN.md</a>。
</footer>
<script type="module">
import { check, applyFixes, maskMarkdownCode } from './engine.mjs';

const $ = (id) => document.getElementById(id);
let data = null;
let preset = 'business';
let violations = [];
let lastApplied = [];
try { const d = localStorage.getItem('dc-draft'); if (d) $('src').value = d; } catch (e) {}
try { const p = localStorage.getItem('dc-preset'); if (p) preset = p; } catch (e) {}

function activeRules(name = preset) {
  const ids = new Set(data.presets[name]);
  return data.rules.filter((r) => ids.has(r.id) && !r.manual);
}

// 検出0件のとき、他のプリセットなら当たるかを調べる。プリセットで検出範囲が変わることを
// 画面から分かるようにするため (ux-microcopyは19規則しか使わないので、比喩や誇張は素通りする)
function wider(text) {
  for (const name of ['business', 'paper', 'chat']) {
    if (name === preset) continue;
    const n = check(maskMarkdownCode(text), activeRules(name)).length;
    if (n > 0) return { name, n };
  }
  return null;
}

function setPresetNote() {
  const info = data.presetInfo[preset];
  $('preset-note').textContent = `${info.description} このプリセットは${info.activeCount}規則で検査します。`;
}

function loadSample() {
  $('src').value = data.presetInfo[preset].sample;
  try { localStorage.setItem('dc-draft', $('src').value); } catch (e) {}
  lastApplied = [];
  render();
  $('src').focus();
}

function instText() {
  const lines = violations.map((v) => {
    const rule = data.rules.find((r) => r.id === v.ruleId);
    return `- 「${v.matched}」(${v.line}行目): ${v.why} 代わりに: ${v.ask}`;
  });
  return '次の日本語テキストを、意味・固有名詞・数値を変えずに書き直してください。語尾は敬体、日本語と英数字の間に半角スペースを入れない、太字と絵文字を使わない。指摘は以下です。\n' +
    lines.join('\n') + '\n\n--- テキスト ---\n' + $('src').value;
}

function render() {
  const text = $('src').value;
  const box = $('findings');
  box.textContent = '';
  if (!text.trim()) {
    $('summary').textContent = '';
    $('hint').textContent = '';
    $('autofix').disabled = $('copy-text').disabled = $('copy-inst').disabled = true;
    const empty = document.createElement('div');
    empty.className = 'empty';
    const p = document.createElement('p');
    p.textContent = '左に文章を貼ると、辞書にある言い回しをその場で検出します。動きを見るなら例文から始められます。';
    const b = document.createElement('button');
    b.className = 'ghost';
    b.textContent = '例文を入れる';
    b.addEventListener('click', loadSample);
    empty.append(p, b);
    box.appendChild(empty);
    return;
  }
  violations = check(maskMarkdownCode(text), activeRules());
  const errors = violations.filter((v) => v.severity === 'error').length;
  const fixables = violations.filter((v) => v.fix !== undefined).length;
  $('summary').innerHTML = violations.length
    ? `${violations.length}件 (<span class="err">error ${errors}</span> / 自動修正可 ${fixables})`
    : '';
  const rest = violations.length - fixables;
  $('autofix').disabled = fixables === 0;
  $('autofix').textContent = `自動修正を適用(${fixables}件)`;
  $('copy-text').disabled = false;
  $('copy-inst').disabled = rest === 0;
  // 「残り」は自動修正の後に使う語。置換で直せる検出が無いときは最初から全件が対象になる
  $('copy-inst').textContent = fixables > 0
    ? `残り${rest}件をAIに直させる指示文をコピー`
    : `${rest}件をAIに直させる指示文をコピー`;
  // 自動修正できるものが無いときは、AIへの導線を主ボタンにする
  $('autofix').classList.toggle('primary', fixables > 0);
  $('autofix').classList.toggle('ghost', fixables === 0);
  $('copy-inst').classList.toggle('primary', fixables === 0 && rest > 0);
  $('copy-inst').classList.toggle('ghost', !(fixables === 0 && rest > 0));
  $('hint').textContent = violations.length === 0 ? '' :
    rest === 0 ? '「自動修正を適用」を押すと、このテキストエリアの本文がその場で書き換わります。'
    : fixables === 0 ? 'この検出は表記の置換では直せないので、この画面では本文は書き換わりません。書き直すのはAIチャットの役目です。手順: (1)青いボタンで指示文をコピー、(2)お使いのAIチャットに貼ると書き直した本文が返る、(3)返ってきた本文をここに貼り直すと再検査できます。検出なしになれば完成です。'
    : '手順: まず「自動修正を適用」(本文がその場で書き換わります)。残りは指示文をAIチャットに貼り、返ってきた本文をここに貼り直して再検査してください。';
  if (lastApplied.length) {
    const d = document.createElement('details');
    d.className = 'applied';
    d.open = true;
    const sum = document.createElement('summary');
    sum.textContent = `適用した置換 ${lastApplied.length}件`;
    d.appendChild(sum);
    for (const e of lastApplied) {
      const row = document.createElement('p');
      const del = document.createElement('del');
      del.textContent = e.before.replace(/\n/g, '\\n');
      const ins = document.createElement('ins');
      ins.textContent = e.after === '' ? '(削除)' : e.after.replace(/\n/g, '\\n');
      row.append(del, ' → ', ins);
      d.appendChild(row);
    }
    box.appendChild(d);
  }
  if (!violations.length) {
    const info = data.presetInfo[preset];
    const ok = document.createElement('div');
    ok.className = 'allclear';
    ok.textContent = `${preset}の${info.activeCount}規則には一致しませんでした`;
    const note = document.createElement('p');
    note.className = 'why';
    note.textContent = 'この検査は辞書にある表現の有無だけを見ます。文章が読みやすいか、内容が正しいかは判定していません。';
    box.append(ok, note);
    const other = wider(text);
    if (other) {
      const alt = document.createElement('p');
      alt.className = 'why';
      alt.textContent = `${other.name}に切り替えると${other.n}件見つかります。プリセットごとに検査する規則が違います。`;
      box.appendChild(alt);
    }
    return;
  }
  for (const v of violations) {
    const el = document.createElement('div');
    el.className = 'finding';
    const sev = v.severity === 'error' ? 'err' : v.severity === 'warn' ? 'wrn' : '';
    el.innerHTML =
      `<div class="top"><span class="expr"></span><span class="tag ${sev}">${v.severity}</span>` +
      (v.fix !== undefined ? '<span class="tag fix">自動修正可</span>' : '') +
      `<span class="loc">${v.line}行:${v.col}</span></div>` +
      (v.fix !== undefined
        ? `<p class="ask"><b>自動修正</b><span class="diffpair"></span></p>`
        : `<p class="ask"><b>AIで書き直し</b>${escapeHtml(v.ask)}</p>`);
    el.querySelector('.expr').textContent = v.matched.replace(/\n/g, '\\n');
    // 置換で直せない検出は、辞書が持つ書き換え例を出す。言い換えの正解は書き手しか持たないので
    // ブラウザ内では本文を書き換えられない。何を書けばよいのかを例で示す
    if (v.fix === undefined) {
      const rule = data.rules.find((r) => r.id === v.ruleId);
      if (rule?.bad && rule?.good) {
        const ex = document.createElement('div');
        ex.className = 'example';
        const label = document.createElement('b');
        label.textContent = '辞書の書き換え例';
        const bad = document.createElement('p');
        bad.className = 'ex-bad';
        bad.textContent = rule.bad;
        const good = document.createElement('p');
        good.className = 'ex-good';
        good.textContent = rule.good;
        ex.append(label, bad, good);
        el.appendChild(ex);
      }
    }
    if (v.fix !== undefined) {
      const pair = el.querySelector('.diffpair');
      const del = document.createElement('del');
      del.textContent = v.matched.replace(/\n/g, '\\n');
      const ins = document.createElement('ins');
      ins.textContent = v.fix === '' ? '(削除)' : v.fix.replace(/\n/g, '\\n');
      pair.append(del, ' → ', ins);
    }
    box.appendChild(el);
  }
}
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

let timer = null;

$('src').addEventListener('input', () => {
  lastApplied = [];
  clearTimeout(timer);
  timer = setTimeout(() => {
    try { localStorage.setItem('dc-draft', $('src').value); } catch (e) {}
    render();
  }, 250);
});

$('autofix').addEventListener('click', () => {
  const text = $('src').value;
  const { text: fixed, applied } = applyFixes(text, activeRules(), { maskedText: maskMarkdownCode(text) });
  $('src').value = fixed;
  lastApplied = applied;
  try { localStorage.setItem('dc-draft', fixed); } catch (e) {}
  flash($('autofix'), `${applied.length}件を置換しました`);
  render();
});

function copyBtn(btn, getText, doneLabel) {
  btn.addEventListener('click', () => {
    const done = () => flash(btn, doneLabel);
    if (navigator.clipboard) navigator.clipboard.writeText(getText()).then(done, done);
  });
}
function flash(btn, label) {
  const prev = btn.textContent;
  btn.textContent = label;
  btn.classList.add('done');
  setTimeout(() => { btn.textContent = prev; btn.classList.remove('done'); }, 1500);
}
copyBtn($('copy-text'), () => $('src').value, 'コピーしました');
copyBtn($('copy-inst'), instText, 'コピーしました。AIの返答をここに貼り直すと再検査できます');

fetch('./app-data.json').then((r) => r.json()).then((d) => {
  data = d;
  if (!data.presetInfo[preset]) preset = 'business'; // 保存済みの名前が辞書から消えた場合
  const box = $('presets');
  for (const name of ['business', 'paper', 'chat', 'ux-microcopy']) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = name;
    b.setAttribute('aria-pressed', String(name === preset));
    b.addEventListener('click', () => {
      preset = name;
      try { localStorage.setItem('dc-preset', name); } catch (e) {}
      box.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      setPresetNote();
      render();
    });
    box.appendChild(b);
  }
  const g = $('guards');
  for (const guard of d.guards) {
    const b = document.createElement('button');
    b.className = 'ghost';
    b.textContent = guard.title;
    copyBtn(b, () => guard.body, 'コピーしました');
    g.appendChild(b);
  }
  setPresetNote();
  render();
}).catch(() => {
  $('summary').textContent = 'データを読み込めませんでした。再読み込みしてください';
});
</script>
</body>
</html>
